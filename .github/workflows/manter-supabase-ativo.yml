# O Supabase gratuito pausa o projeto depois de ~1 semana sem uso — e aí o login
# e a sincronização param ("Load failed"). Esta tarefa faz uma consulta pequena a
# cada 3 dias para ele nunca ficar parado. Usa só a chave pública, que já está no
# index.html, e por causa do RLS não lê nenhum dado. Se o Supabase não responder,
# a tarefa falha e o GitHub avisa por e-mail.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 9 */3 * *"   # a cada 3 dias, 06:17 de Brasília
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta pequena no Supabase
        run: |
          URL=$(grep -oP "var SUPA_URL = '\K[^']+" index.html)
          KEY=$(grep -oP "var SUPA_KEY = '\K[^']+" index.html)
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 "$URL/rest/v1/dados?select=user_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondeu HTTP $code"
          test "$code" = "200"
